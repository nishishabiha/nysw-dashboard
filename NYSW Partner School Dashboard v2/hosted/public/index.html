<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Partner School Success Dashboard · NY Sun Works</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --green:#80BC00; --green-d:#3F6B00; --green-dd:#255007; --green-l:#EEF6DA; --green-xl:#F6FAEA;
  --slate:#55585A; --ink:#2B2D2E; --mute:#8A8E90; --line:#E6E8E3; --bg:#FAFBF7; --card:#fff;
  --yellow:#FED932; --yellow-l:#FFF6CC; --red:#F83311; --red-l:#FFE9E4; --orange:#F08A1C; --orange-l:#FFF0DC;
  --r:14px;
  --f:'Open Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; --fh:'Montserrat','Open Sans',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--f);color:var(--slate);background:var(--bg);font-size:14px;line-height:1.5}
h1,h2,h3,h4{font-family:var(--fh);color:var(--slate);margin:0;line-height:1.2}
button{font:inherit;cursor:pointer}
a{color:var(--green-d)}
.hide{display:none!important}
/* header */
.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.top-in{max-width:1320px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:28px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo{font-family:var(--fh);font-weight:800;line-height:.9;font-size:19px;letter-spacing:-.5px;color:var(--green);text-transform:uppercase;display:block}
.logo b{color:var(--slate);font-weight:800}
.brand small{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:700;margin-top:3px}
nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
nav button{background:none;border:0;padding:10px 12px;font-weight:700;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--slate);border-bottom:3px solid transparent;border-radius:0}
nav button:hover{color:var(--green-d)}
nav button.on{color:var(--green-d);border-bottom-color:var(--green)}
nav .badge{display:inline-block;background:var(--red);color:#fff;border-radius:10px;padding:0 6px;font-size:10px;margin-left:5px;vertical-align:1px}
.who{display:flex;align-items:center;gap:8px;font-size:12px}
.btn{background:var(--yellow);color:#000;border:0;border-radius:15px;padding:8px 16px;font-weight:800;font-size:12.5px;text-transform:uppercase;letter-spacing:.03em}
.btn:hover{filter:brightness(.96)}
.btn.g{background:var(--green);color:#10260a}
.btn.o{background:#fff;border:1.5px solid var(--green);color:var(--green-d)}
.btn.s{padding:5px 11px;font-size:11px;border-radius:11px}
.btn.d{background:#fff;border:1.5px solid var(--line);color:var(--slate)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
main{max-width:1320px;margin:0 auto;padding:22px 24px 80px}
.hero{padding:6px 0 14px}
.hero h1{font-size:30px;font-weight:800;text-transform:uppercase;letter-spacing:-.3px}
.hero h1 em{font-style:normal;color:var(--green)}
.hero p{margin:6px 0 0;max-width:820px;color:var(--slate)}
.asof{display:inline-flex;gap:6px;align-items:center;background:var(--green-l);color:var(--green-dd);border-radius:20px;padding:3px 12px;font-size:12px;font-weight:700;margin-top:10px}
/* cards */
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(185px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.card h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--slate);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.tile{border-top:4px solid var(--green);padding-top:14px}
.tile.red{border-top-color:var(--red)} .tile.yel{border-top-color:var(--yellow)} .tile.org{border-top-color:var(--orange)}
.tile .lab{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--mute)}
.tile .big{font-family:var(--fh);font-size:34px;font-weight:800;color:var(--ink);line-height:1.1;margin:2px 0}
.tile .sub{font-size:12px;color:var(--slate)}
.tile.click{cursor:pointer}.tile.click:hover{box-shadow:0 3px 10px rgba(63,107,0,.14)}
.sec{margin:26px 0 10px;display:flex;align-items:end;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec h2{font-size:18px;text-transform:uppercase}
.sec h2 em{font-style:normal;color:var(--green)}
.sec span{font-size:12px;color:var(--mute)}
/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:12px;padding:1px 9px;font-size:11px;font-weight:700;white-space:nowrap}
.c-high{background:var(--red-l);color:#B21D04}.c-med{background:var(--orange-l);color:#9B5A07}.c-low{background:var(--yellow-l);color:#7A6100}
.c-up{background:#E9F1FB;color:#2A5C99}.c-ok{background:var(--green-l);color:var(--green-dd)}.c-n{background:#EEF0EE;color:var(--slate)}
.grade{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;border-radius:8px;font-family:var(--fh);font-weight:800;font-size:13px}
.gA,.gB{background:var(--green);color:#10260a}.gC{background:var(--yellow);color:#000}.gD{background:var(--orange);color:#fff}.gF{background:var(--red);color:#fff}.gP{background:#E4E6E3;color:var(--slate)}
/* table */
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.tools input,.tools select,.f input,.f select,.f textarea{font:inherit;border:1.5px solid var(--line);border-radius:10px;padding:7px 10px;background:#fff;color:var(--ink)}
.tools input[type=search]{min-width:250px}
.tools input:focus,.tools select:focus,.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--green);outline-offset:0;border-color:var(--green)}
.tbl{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tbl th{background:var(--green-xl);text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:9px 10px;color:var(--slate);white-space:nowrap;cursor:pointer;user-select:none;border-bottom:1px solid var(--line)}
.tbl th.ns{cursor:default}
.tbl td{padding:8px 10px;border-bottom:1px solid #F0F2EC;vertical-align:middle}
.tbl tr.row{cursor:pointer}.tbl tr.row:hover td{background:var(--green-xl)}
.tbl tr:last-child td{border-bottom:0}
.nm b{color:var(--ink);font-weight:700}.nm small{color:var(--mute);display:block;font-size:11px}
.bar{height:7px;border-radius:5px;background:#ECEEE8;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--green);border-radius:5px}
.bar.y i{background:var(--yellow)}.bar.r i{background:var(--red)}.bar.o i{background:var(--orange)}
.muted{color:var(--mute)}.right{text-align:right}
.pager{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px}
/* alerts */
.al{display:flex;gap:12px;padding:11px 14px;border:1px solid var(--line);border-left:5px solid var(--yellow);border-radius:12px;background:#fff;margin-bottom:8px}
.al.high{border-left-color:var(--red)}.al.med{border-left-color:var(--orange)}.al.upcoming{border-left-color:#4A86C9}
.al .t{flex:1;min-width:0}.al .t b{color:var(--ink)}
.al .act{font-size:12px;color:var(--green-dd);margin-top:2px}
.al .btns{display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap;justify-content:flex-end}
.al.done{opacity:.6}
/* drawer */
.ov{position:fixed;inset:0;background:rgba(30,35,25,.35);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(860px,100vw);background:var(--bg);z-index:41;overflow:auto;box-shadow:-8px 0 30px rgba(0,0,0,.15)}
.dh{background:#fff;padding:18px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2;display:flex;gap:14px;align-items:flex-start}
.dh h2{font-size:21px}.dh .x{margin-left:auto;background:none;border:0;font-size:26px;line-height:1;color:var(--mute)}
.db{padding:18px 24px 60px;display:grid;gap:14px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kv div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.kv small{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--mute)}
.kv span{font-weight:700;color:var(--ink)}
.wk{display:flex;gap:5px;flex-wrap:wrap}
.wk div{width:54px;text-align:center;font-size:10px;padding:5px 0;border-radius:8px;background:#EEF0EE;color:var(--slate);font-weight:700}
.wk .ok{background:var(--green);color:#10260a}.wk .late{background:#CDE79A;color:#2d4b06}.wk .miss{background:var(--red);color:#fff}.wk .exc{background:var(--yellow-l);color:#7A6100}.wk .none{background:#F3F4F1;color:#B6BAB6}
.stage{display:flex;gap:0;align-items:center;margin:6px 0 2px}
.stage div{flex:1;text-align:center;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#A9ADA9;position:relative;padding-top:16px}
.stage div:before{content:"";position:absolute;top:3px;left:0;right:0;height:5px;background:#E4E6E3}
.stage div:after{content:"";position:absolute;top:-1px;left:50%;margin-left:-6px;width:12px;height:12px;border-radius:50%;background:#E4E6E3;border:2px solid #fff}
.stage div.on{color:var(--green-dd)}.stage div.on:before,.stage div.on:after{background:var(--green)}
.stage div:first-child:before{left:50%}.stage div:last-child:before{right:50%}
.note{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px}
.note.pin{border-color:var(--yellow);background:#FFFDF0}
.note .m{font-size:11px;color:var(--mute);display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:3px}
.note p{margin:0;white-space:pre-wrap;color:var(--ink)}
.f{display:grid;gap:8px}.f textarea{width:100%;min-height:70px;resize:vertical}
.f .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.src{font-size:11px;color:var(--mute)}
details{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 14px}
summary{cursor:pointer;font-weight:700;color:var(--ink)}
.mini{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}.mini th{text-align:left;color:var(--mute);font-size:10.5px;text-transform:uppercase;padding:3px 6px}.mini td{padding:4px 6px;border-top:1px solid #F0F2EC;vertical-align:top}
.ktbl td,.ktbl th{padding:6px 8px}
.num{width:78px;text-align:right}
.tot{font-family:var(--fh);font-weight:800;font-size:22px}
.tot.bad{color:var(--red)}.tot.good{color:var(--green-d)}
.callout{border-radius:12px;padding:12px 16px;background:var(--yellow-l);border:1px solid #F1DB6A;color:#5b4a00;font-size:13px}
.callout.g{background:var(--green-xl);border-color:#CFE59A;color:var(--green-dd)}
.callout.r{background:var(--red-l);border-color:#F5B7AA;color:#8a1a05}
.lim li{margin-bottom:7px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--green-dd);color:#fff;padding:9px 18px;border-radius:20px;z-index:99;font-weight:700;font-size:13px}
@media(max-width:800px){.top-in{flex-wrap:wrap;gap:8px}.g2{grid-template-columns:1fr}.hero h1{font-size:22px}}
@media print{.top,.tools,.btn{display:none!important}}
.gate{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.gate .box{background:#fff;border:1px solid var(--line);border-radius:18px;padding:30px;width:min(400px,100%);box-shadow:0 8px 30px rgba(0,0,0,.08)}
.gate h1{font-size:20px;text-transform:uppercase;margin:14px 0 4px}.gate h1 em{font-style:normal;color:var(--green)}
.gate label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:12px 0 3px}
.gate input{width:100%;font:inherit;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px}
.gate input:focus{outline:2px solid var(--green);border-color:var(--green)}
.gate .err{color:#B21D04;font-size:12.5px;margin-top:10px;min-height:18px}
.ro .editonly,.ro .ntrow,.ro #ntext,.ro .al .btns{display:none!important}
</style>
</head>
<body>
<div id="gate" class="gate hide"></div>
<header class="top" id="hdr"><div class="top-in">
  <a class="brand" href="#"><span class="logo">NY<b>SUN</b><br>WORKS<small>Partner School Success</small></span></a>
  <nav id="nav"></nav>
  <div class="who"><span class="muted" id="whoLbl"></span><button class="btn s d" id="whoBtn">Account</button><button class="btn s g hide" id="expBtn">Backup</button></div>
</div></header>
<main id="main"></main>
<div id="ovl"></div>

<script src="/engine.js"></script>
<script>
'use strict';
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let ST, ME, DATA, ENG, CAN={edit:false,admin:false};
let R={};
async function api(method, url, body){
  const r = await fetch(url,{method,headers:{'Content-Type':'application/json','X-Requested-With':'nysw'},body:body?JSON.stringify(body):undefined,credentials:'same-origin'});
  if(r.status===401){ location.reload(); throw new Error('Signed out'); }
  let j={}; try{ j=await r.json(); }catch(e){}
  if(!r.ok){ const err=new Error(j.error||('Request failed ('+r.status+')')); err.status=r.status; throw err; }
  return j;
}
function start(){
  ENG = NYSWEngine.create(DATA, ()=>ST);
  CAN = {edit: ME.role!=='viewer', admin: ME.role==='admin'};
  document.body.classList.toggle('ro', !CAN.edit);
  window.__eng = ENG;
}
const E_ = new Proxy({}, {get:(_,k)=>ENG[k]});
const clamp=(...a)=>ENG.clamp(...a), fmtD=d=>ENG.fmtD(d), fmtDY=d=>ENG.fmtDY(d), dayDiff=(a,b)=>ENG.dayDiff(a,b), pct=x=>ENG.pct(x), avg=a=>ENG.avg(a), clone=o=>ENG.clone(o);
const activeCfg=()=>ENG.activeCfg(), computeAll=(c)=>ENG.computeAll(c), alertState=(c,a)=>ENG.alertState(c,a);
const GROUPS_=()=>ENG.GROUPS;
const SEV={high:3,med:2,low:1,upcoming:0}, SEVL={high:'Act now',med:'Soon',low:'Watch',upcoming:'Coming up'};
const RULES={missed:'Missed weekly assets',stale:'No recent visit',offline:'System not running',pest:'Pests',leak:'Leaks',harvest:'Harvest',training:'Training no-show',tt:'Training asset missing',amv:'AM visit pace',principal:'Principal contact',curr:'Curriculum use',contact:'Teacher change'};
const save=()=>{};
function digestText(am){ return ENG.digestTextFor(R, am, location.origin); }
/* ===================== STATE / STORAGE ===================== */
let UI = {tab:'today', q:'', am:'', gst:'', boro:'', grade:'', stage:'', flag:'', sort:'score', dir:1, page:0, open:null, aq:{am:'', rule:'', sev:'', st:'open'}, draft:null};
function toast(m){ const t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }

/* ===================== ENGINE ===================== */
function sevChip(s){ const c={high:'c-high',med:'c-med',low:'c-low',upcoming:'c-up'}[s]; return `<span class="chip ${c}">${SEVL[s]}</span>`; }
const gradeChip = (E) => E.score==null ? `<span class="grade gP">—</span>` : `<span class="grade ${E.prov?'gP':'g'+E.grade}" title="${E.prov?'Provisional: not enough data':'Grade '+E.grade}">${E.grade}</span>`;

/* ===================== VIEWS ===================== */
const TABS=[['today','Today'],['schools','Schools'],['queue','Action queue'],['ams','Area managers'],['rubric','Rubric'],['health','Data health'],['account','Account']];
function renderNav(){
  const open=Object.values(R).reduce((n,r)=>n+r.al.filter(a=>a.sev==='high'&&alertState(r.s.code,a)==='open').length,0);
  $('#nav').innerHTML=(CAN.admin?TABS.concat([['admin','Admin']]):TABS).map(([k,l])=>`<button data-tab="${k}" class="${UI.tab===k?'on':''}">${l}${k==='queue'&&open?`<span class="badge">${open}</span>`:''}</button>`).join('');
  $('#whoLbl').textContent=`${ME.name} · ${ME.role}`;
  $('#whoBtn').textContent='Account';
  $('#expBtn').classList.toggle('hide',!CAN.admin);
}
function render(){ R=computeAll(); renderNav(); const m=$('#main');
  ({today:vToday,schools:vSchools,queue:vQueue,ams:vAMs,rubric:vRubric,health:vHealth,account:vAccount,admin:vAdmin})[UI.tab](m);
  if(UI.open) renderDrawer(UI.open);
}
function hero(m,h,p){ const set=activeCfg().settings; m.innerHTML=`<div class="hero"><h1>${h}</h1><p>${p}</p><span class="asof">Data through ${fmtDY(set.asOf)} · full weeks scored through ${fmtDY(set.evalThrough)}</span></div>`; }
const allR = () => Object.values(R);
function openAlerts(filter){ const out=[]; allR().forEach(r=>r.al.forEach(a=>{ const st=alertState(r.s.code,a); if(!filter||filter(a,st,r)) out.push({a,st,r}); })); return out; }

function vToday(m){
  hero(m,'Keep every <em>partner school</em> growing','Immediate read on your schools: who needs a call, who is thriving, and what is coming due. Grades re-score live from the rubric you can edit; notes and snoozes save in this browser.');
  const rs=allR(), scored=rs.filter(r=>r.E.score!=null), set=activeCfg().settings;
  const act=openAlerts((a,st)=>st==='open'&&a.sev==='high'), actSchools=new Set(act.map(x=>x.r.s.code)).size;
  const comp=rs.map(r=>r.E.C).filter(c=>c.den); const tOk=comp.reduce((a,c)=>a+c.ok,0), tDen=comp.reduce((a,c)=>a+c.den,0);
  const noH=rs.filter(r=>r.E.H.n===0&&r.s.agg.n>0).length, withH=rs.filter(r=>r.E.H.n>0).length;
  const amvDone=rs.filter(r=>r.s.amv.length>0).length;
  const grades=['A','B','C','D','F'].map(g=>[g,scored.filter(r=>!r.E.prov&&r.E.grade===g).length]); const prov=scored.filter(r=>r.E.prov).length;
  const bands=set.bands;
  m.insertAdjacentHTML('beforeend',`<div class="grid g4">
   <div class="card tile red click" data-go="queue"><div class="lab">Need action now</div><div class="big">${actSchools}</div><div class="sub">schools with an open "act now" alert</div></div>
   <div class="card tile"><div class="lab">Avg score (all with data)</div><div class="big">${scored.length?Math.round(avg(scored.map(r=>r.E.score))):'—'}</div><div class="sub">${scored.length} schools scored · ${prov} provisional</div></div>
   <div class="card tile"><div class="lab">Weekly assets completed</div><div class="big">${tDen?pct(tOk/tDen):'—'}</div><div class="sub">${tOk} of ${tDen} scheduled school-weeks (cadence- &amp; grace-adjusted)</div></div>
   <div class="card tile yel click" data-go="schools" data-flag="noharvest"><div class="lab">Harvest status</div><div class="big">${withH} <span style="font-size:15px;color:var(--mute)">harvested</span></div><div class="sub">${noH} still need a first harvest by ${fmtD(set.harvestDue)} (${dayDiff(set.harvestDue,set.asOf)} days)</div></div>
   <div class="card tile org"><div class="lab">Area manager visits</div><div class="big">${amvDone}<span style="font-size:15px;color:var(--mute)"> / ${rs.length}</span></div><div class="sub">schools visited at least once this year (target ${set.amvAnnualTarget}/yr)</div></div>
  </div>`);
  m.insertAdjacentHTML('beforeend',`<div class="grid g2" style="margin-top:14px">
   <div class="card"><h3>Grade mix <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:400">A ≥${bands.A} · B ≥${bands.B} · C ≥${bands.C} · D ≥${bands.D}</span></h3>
    ${grades.map(([g,n])=>`<div style="display:flex;align-items:center;gap:10px;margin:5px 0"><span class="grade g${g}">${g}</span><div class="bar" style="flex:1;height:12px"><i style="width:${scored.length?n/scored.length*100:0}%"></i></div><b style="width:34px;text-align:right">${n}</b></div>`).join('')}
    <div style="display:flex;align-items:center;gap:10px;margin:5px 0"><span class="grade gP">…</span><div class="bar" style="flex:1;height:12px"><i style="width:${scored.length?prov/scored.length*100:0}%;background:#C9CCC8"></i></div><b style="width:34px;text-align:right">${prov}</b></div>
    <div class="src">Provisional = less than ${set.minConfidence}% of the rubric's points have data yet (e.g., no AM visit, no ed-team session). They are scored on what exists, never penalized for what has not happened.</div></div>
   <div class="card"><h3>Open alerts by type</h3>${(()=>{const c={};openAlerts((a,st)=>st==='open'&&a.sev!=='upcoming').forEach(x=>{c[x.a.rule]=c[x.a.rule]||{n:0,s:x.a.sev};c[x.a.rule].n++; if(SEV[x.a.sev]>SEV[c[x.a.rule].s])c[x.a.rule].s=x.a.sev;});

   <li><b>Only 9 weeks of data.</b> No trend lines or year-over-year comparisons are possible yet. Use “Backup” and the snapshots in notes to start your own history; a persistent database is needed for real trends.</li>
   <li><b>Harvest data is thin and messy.</b> Only ${rs.filter(r=>r.E.H.n>0).length} schools have a harvest logged; weights are free text (“13 oz”, “2078 gr”, “~20”, bare “10”), so pounds are converted when a unit exists and bare numbers are marked ambiguous. Harvest points phase in Nov 1 → Jan 15 so an early blank doesn't tank a grade.</li>
   <li><b>The export has no “submitted on” date.</b> A truly <i>late</i> asset can't be told from an on-time one; “late” here means a make-up visit in a following week. A Created/Submitted timestamp from Accelo would fix this.</li>
   <li><b>The weekly schedule is a template, not a record of visits.</b> It is a human-readable grid: codes are extracted by pattern, “@” pairs are treated as one visit, and entries like “SBH”, “Lincoln”, “Roaring Brook” rely on name matching. Cadence (EOW/monthly) is inferred from notes typed in the cells and is inconsistent week to week.</li>
   <li><b>The current week is incomplete.</b> The Nov 2–6 week had ~36 assets when exported (vs ~250 normally), so it is excluded from scoring (“full weeks through” date).</li>
   <li><b>Area manager assignment comes from the asset files.</b> ${noAM.length} schools have no AM; ${nonSchool.length} partners are not NYC DBN schools (NJ/AL/Westchester/community orgs like UPROSE). Use “Edit assignment / hide from list” in a school's profile; changes are local until the roster is fixed in Accelo.</li>
   <li><b>Not in the upload, so not scored:</b> teacher survey, HC performance, maintenance agreements, thank-you/support letters, events, photo timestamps, billable-hour logs, the scheduling-sheet “lab available” column (V). The rubric is rebuilt around what <i>is</i> available.</li>
   <li><b>Teacher/principal turnover</b> can only be hinted at from the “Affiliation” contact on asset reports (it flips between people at many schools, so only a sustained switch is flagged) and “teachers trained” names, over 9 weeks of data. Log changes in school notes (type: Teacher change / Principal change) to build the history.</li>
   <li><b>“Systems not running” is self-reported</b> by GSTs and the same list is often copy-pasted visit to visit, so a long streak may be stale reporting rather than a still-broken system. Alerts say “reported”, not “confirmed”.</li>
   <li><b>No login yet.</b> Notes and snoozes save in <i>this browser</i> with the name you set, not on a server. Use Backup to export/import. A shared database + login is on the roadmap.</li></ul></div>
  <div class="sec"><h2>Schools to <em>clean up</em></h2><span>${noAM.length} without an AM</span></div>
  <div class="card"><div style="columns:2;font-size:12.5px">${noAM.map(r=>`<div><a href="#" data-open="${r.s.code}">${esc(r.s.full)}</a></div>`).join('')}</div></div>
  <div class="sec"><h2>On the <em>roadmap</em></h2><span>From the Nov area-manager meeting</span></div>
  <div class="card"><div class="grid g2" style="gap:10px"><div><b>Built here</b><ul class="lim"><li>Action queue with acknowledge / snooze / resolve</li><li>Email digest per AM (opens your mail app)</li><li>Editable rubric with version history &amp; 100-point check</li><li>Harvest phase-in, cadence-aware and grace-window asset scoring</li><li>Growth stage per lab; GST visit day</li><li>Editable notes, AM reassignment, teacher/principal change log</li></ul></div>
  <div><b>Needs a server / more data</b><ul class="lim"><li>Real login, roles and an audit trail of who edited what</li><li>Automatic email alerts (needs a mail service)</li><li>Photo-timestamp check (needs Drive metadata)</li><li>Principal Engagement rubric / Principal Relationship asset in Accelo</li><li>Teacher &amp; principal turnover history (needs a contacts table)</li><li>Asset created-date, billable hours at asset entry</li></ul></div></div></div>`);
}

document.addEventListener('click',e=>{

  if(e.target.id==='clr'){ Object.assign(UI,{q:'',am:'',gst:'',boro:'',grade:'',stage:'',flag:'',page:0}); render(); return; }
  if(e.target.id==='csv') return exportCSV();
  if(e.target.id==='digest'){ const d=digestText(UI.aq.am); openDigest(UI.aq.am,d); return; }
  if(e.target.id==='rbal'){ const on=UI.draft.kpis.filter(k=>k.on), tot=on.reduce((a,k)=>a+(+k.w||0),0)||1; on.forEach(k=>k.w=Math.max(0,Math.round(k.w/tot*100))); const diff=100-on.reduce((a,k)=>a+k.w,0); on.sort((a,b)=>b.w-a.w)[0].w+=diff; render(); return; }
  if(e.target.id==='rrev'){ UI.draft=null; render(); return; }
  if(e.target.id==='rsave'){ const note=$('#rnote').value.trim(); if(!note){toast('Add a reason for the change first.');return;}
    const d=UI.draft; mutate('/api/rubric',{cfg:d,note},'Rubric saved').then(()=>{UI.draft=null;render();}); return; }
  if(e.target.id==='whoBtn'){ UI.tab='account'; closeDrawer(); render(); return; }
  if(e.target.id==='expBtn') return window.open('/api/admin/backup');
  if(adminClick(e)) return;
  if(!t) return;
  if(t.dataset.close){ closeDrawer(); return; }
  if(t.dataset.tab){ UI.tab=t.dataset.tab; closeDrawer(); render(); window.scrollTo(0,0); return; }
  if(t.dataset.go){ e.preventDefault(); UI.tab=t.dataset.go; if(t.dataset.flag){UI.flag=t.dataset.flag;} render(); window.scrollTo(0,0); return; }
  if(t.dataset.open){ e.preventDefault(); if(e.target.closest('[data-al]')&&!e.target.closest('a')&&e.target.dataset.open===undefined) {} UI.open=t.dataset.open; renderDrawer(UI.open); $('.drawer')?.scrollTo(0,0); return; }
  if(t.dataset.sort){ const k=t.dataset.sort; if(UI.sort===k) UI.dir*=-1; else {UI.sort=k;UI.dir=(k==='name'||k==='am'||k==='gst')?1:-1;} drawTable(); return; }
  if(t.dataset.pg){ UI.page+=+t.dataset.pg; drawTable(); return; }
  if(t.dataset.amq){ UI.aq.am=t.dataset.amq; UI.tab='queue'; render(); return; }
  if(t.dataset.dig){ openDigest(t.dataset.dig,digestText(t.dataset.dig)); return; }
  if(t.dataset.rest){ const v=ST.rubrics.find(x=>x.v==t.dataset.rest); UI.draft=clone(v.cfg); render(); toast('Loaded v'+v.v+' as a draft'); return; }
  if(t.dataset.npin){ mutate('/api/note/pin',{code:UI.open,id:t.dataset.npin}); return; }
  if(t.dataset.ndel){ if(confirm('Delete this note?')) mutate('/api/note/delete',{code:UI.open,id:t.dataset.ndel}); return; }
  if(t.dataset.al){ const c=t.dataset.c, ru=t.dataset.r, a=R[c].al.find(x=>x.rule===ru), act=t.dataset.al;
    mutate('/api/alert',{code:c,rule:ru,status:act==='snooze'?'snoozed':act,sig:a.sig,until:act==='snooze'?new Date(Date.parse(activeCfg().settings.asOf)+14*864e5).toISOString().slice(0,10):null}); return; }
});

async function mutate(url,payload,msg){
  try{ const r=await api('POST',url,payload); if(r.state){ ST=r.state; } if(msg) toast(msg); render(); }
  catch(e){ toast(e.message); throw e; }
}
async function refresh(force){
  try{ const s=await api('GET','/api/state'); const h=JSON.stringify(s); if(force||h!==window._sh){ window._sh=h; ST=s;
    const a=document.activeElement; const typing=a&&/^(TEXTAREA|INPUT|SELECT)$/.test(a.tagName);
    const draftOpen=UI.tab==='rubric'&&UI.draft; if(force||(!typing&&!draftOpen)) render(); } }catch(e){}

function openDigest(am,d){
  if(!d.n){toast('No open alerts to send'+(am?' for '+am:'')+'.');return;}
  const url='mailto:?subject='+encodeURIComponent(d.subject)+'&body='+encodeURIComponent(d.body.slice(0,1700));
  navigator.clipboard?.writeText(d.subject+'\n\n'+d.body).then(()=>toast('Digest copied to clipboard'),()=>{});
  window.location.href=url;
}
function download(name,text,type){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }
function exportCSV(){
  const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
  const rows=[['Code','School','Borough','Area manager','GST','Score','Grade','Data confidence','Assets completed','Last GST visit','Growth stage','Harvests','AM visits','Open alerts','Notes']];

  $('#lf').onsubmit=async ev=>{ ev.preventDefault(); $('#lerr').textContent='';

function showChangePw(forced){
  showGate(`<h1>Choose a <em>new password</em></h1><p class="src">${forced?'Your account needs a new password before you continue.':''} Use at least 10 characters.</p><form id="pf"><label>Current / temporary password</label><input id="pc" type="password" autocomplete="current-password" required><label>New password</label><input id="pn" type="password" autocomplete="new-password" minlength="10" required><div class="err" id="perr"></div><button class="btn g" style="width:100%;margin-top:6px">Save password</button></form>`);

async function boot(){
  let me;
  try{ const r=await fetch('/api/me',{credentials:'same-origin'}); if(r.status===401) return showLogin(); me=await r.json(); }
  catch(e){ return showGate('<p>Cannot reach the server. Check your connection and reload.</p>'); }
  ME=me;
  if(me.mustChange) return showChangePw(true);
  try{ [DATA,ST]=await Promise.all([api('GET','/api/data'),api('GET','/api/state')]); }
  catch(e){ return showGate('<p>'+esc(e.message)+'</p>'); }
  window._sh=JSON.stringify(ST);
  start();
  $('#gate').classList.add('hide'); $('#hdr').classList.remove('hide'); $('#main').classList.remove('hide');
  render();
  if(!window._poll) window._poll=setInterval(()=>{ if(!document.hidden) refresh(); },40000);

  hero(m,'Your <em>account</em>','Notes, alert actions and rubric changes are saved to the shared database with your name on them.');
  m.insertAdjacentHTML('beforeend',`<div class="grid g2"><div class="card"><h3>Profile</h3><div class="kv" style="grid-template-columns:1fr 1fr"><div><small>Name</small><span>${esc(ME.name)}</span></div><div><small>Email</small><span>${esc(ME.email)}</span></div><div><small>Role</small><span>${esc(ME.role)}</span></div><div><small>Weekly email digest</small><span>${ME.am?'Yes — '+esc(ME.am)+' schools':'Not set (ask an admin)'}</span></div></div>
   <p class="src"><b>admin</b> can change the rubric, users and data. <b>staff</b> can add notes, resolve alerts and fix assignments. <b>viewer</b> is read-only.</p><button class="btn d" id="logout">Sign out</button></div>
   <div class="card"><h3>Change password</h3><div class="f"><input id="pc" type="password" placeholder="Current password" autocomplete="current-password"><input id="pn" type="password" placeholder="New password (10+ characters)" autocomplete="new-password"><div class="row"><button class="btn g" id="pwsave">Update password</button></div></div></div></div>`);
}
async function vAdmin(m){
  hero(m,'Team &amp; <em>admin</em>','Manage who can sign in, upload fresh data, restore hidden schools and review the audit trail.');
  m.insertAdjacentHTML('beforeend','<div id="adm" class="muted">Loading…</div>');
  let U,A,Mi; try{ [U,A,Mi]=await Promise.all([api('GET','/api/admin/users'),api('GET','/api/admin/audit?limit=80'),api('GET','/api/admin/mail')]); }catch(e){ $('#adm').textContent=e.message; return; }
  const hidden=Object.entries(ST.ov||{}).filter(([c,o])=>o.excl).map(([c])=>c);
  const ams=[...new Set(Object.values(DATA.schools).map(s=>s.am).filter(Boolean))].sort();
  $('#adm').outerHTML=`
  <div class="card"><h3>Users <span class="src" style="text-transform:none;letter-spacing:0">${U.length}</span></h3>
   <table class="mini"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Digest for AM</th><th>Active</th><th>Last sign-in</th><th></th></tr></thead><tbody>${U.map(u=>`<tr data-urow="${u.id}"><td>${esc(u.name)}</td><td>${esc(u.email)}</td>
    <td><select class="u-role">${['admin','staff','viewer'].map(r=>`<option ${u.role===r?'selected':''}>${r}</option>`).join('')}</select></td>
    <td><select class="u-am"><option value="">— none —</option>${ams.map(a=>`<option ${u.am===a?'selected':''}>${esc(a)}</option>`).join('')}</select></td>
    <td><input type="checkbox" class="u-act" ${u.active?'checked':''}></td><td class="src">${u.lastLogin?new Date(u.lastLogin).toLocaleString():'never'}</td>
    <td><button class="btn s o" data-usave="${u.id}">Save</button> <button class="btn s d" data-ureset="${u.id}">Reset password</button></td></tr>`).join('')}</tbody></table>
   <h3 style="margin-top:16px">Add a user</h3><div class="row f" style="display:flex;gap:8px;flex-wrap:wrap"><input id="nu-name" placeholder="Full name"><input id="nu-email" type="email" placeholder="Email"><select id="nu-role"><option>staff</option><option>viewer</option><option>admin</option></select><select id="nu-am"><option value="">Digest for AM…</option>${ams.map(a=>`<option>${esc(a)}</option>`).join('')}</select><input id="nu-pw" placeholder="Temporary password (10+)"><button class="btn g" id="nu-add">Add user</button></div>
   <div class="src">They are made to choose their own password at first sign-in. Share the temporary password out-of-band, not by email.</div></div>
  <div class="grid g2" style="margin-top:14px"><div class="card"><h3>Email digests</h3><p class="src" style="margin-top:0">${Mi.configured?'Sending is configured (provider: Resend). Digests go out Mondays 7am Eastern to users with a “Digest for AM”.':'Not configured. Set RESEND_API_KEY and MAIL_FROM on the server to enable. Until then, use the “Email digest” buttons (they open your own mail app).'}<br>Last automatic send: ${Mi.last?esc(Mi.last):'never'}</p><div class="row" style="display:flex;gap:8px"><button class="btn s o" id="dg-test" ${Mi.configured?'':'disabled'}>Send me a test</button><button class="btn s g" id="dg-all" ${Mi.configured?'':'disabled'}>Send all digests now</button></div></div>
   <div class="card"><h3>Data</h3><p class="src" style="margin-top:0">Loaded: data through <b>${fmtDY(DATA.meta.asOf)}</b>, built ${esc(DATA.meta.built||'')}. Run the pipeline on new Accelo exports, then upload the generated <code>data.json</code> here — notes and settings are kept.</p><input type="file" id="data-file" accept=".json"> <button class="btn s g" id="data-up">Upload data</button></div></div>
  <div class="card" style="margin-top:14px"><h3>Hidden schools</h3>${hidden.length?hidden.map(c=>`<div>${esc(c)} ${esc(DATA.schools[c]?.name||'')} <button class="btn s d" data-restore="${esc(c)}">Restore</button></div>`).join(''):'<span class="muted">None.</span>'}</div>
  <div class="card" style="margin-top:14px"><h3>Audit trail <span class="src" style="text-transform:none;letter-spacing:0">latest ${A.length}</span></h3><table class="mini"><tbody>${A.map(a=>`<tr><td class="src" style="white-space:nowrap">${new Date(a.ts).toLocaleString()}</td><td><b>${esc(a.by)}</b></td><td>${esc(a.action)}</td><td>${esc(a.target||'')}</td><td class="src">${esc(a.detail||'')}</td></tr>`).join('')}</tbody></table></div>`;
}
function adminClick(e){
  const id=e.target.id, d=e.target.dataset;
  const go=async(fn,msg)=>{ try{ await fn(); if(msg) toast(msg); }catch(er){ toast(er.message); } };
  if(id==='logout'){ go(async()=>{ await api('POST','/api/logout',{}); location.reload(); }); return true; }
  if(id==='pwsave'){ go(async()=>{ await api('POST','/api/password',{current:$('#pc').value,next:$('#pn').value}); $('#pc').value=$('#pn').value=''; },'Password updated'); return true; }
  if(id==='nu-add'){ go(async()=>{ await api('POST','/api/admin/users',{name:$('#nu-name').value,email:$('#nu-email').value,role:$('#nu-role').value,am:$('#nu-am').value||null,password:$('#nu-pw').value}); render(); },'User added'); return true; }
  if(d.usave){ const row=e.target.closest('tr'); go(async()=>{ await api('POST','/api/admin/users/update',{id:d.usave,role:row.querySelector('.u-role').value,am:row.querySelector('.u-am').value||null,active:row.querySelector('.u-act').checked}); render(); },'Saved'); return true; }
  if(d.ureset){ const p=prompt('Temporary password for this user (10+ characters). They will be asked to change it at next sign-in:'); if(p) go(async()=>{ await api('POST','/api/admin/users/update',{id:d.ureset,password:p}); },'Password reset'); return true; }
  if(d.restore){ mutate('/api/override',{code:d.restore,excl:false},'Restored'); return true; }
  if(id==='dg-test'||id==='dg-all'){ go(async()=>{ const r=await api('POST','/api/admin/digest',{all:id==='dg-all'}); toast(`Sent ${r.sent} email${r.sent===1?'':'s'}`); render(); }); return true; }
  if(id==='data-up'){ const f=$('#data-file').files[0]; if(!f){ toast('Choose data.json first'); return true; } go(async()=>{ const txt=await f.text(); const j=JSON.parse(txt); const r=await api('POST','/api/admin/data',j); DATA=await api('GET','/api/data'); start(); render(); },'Data updated'); return true; }
  return false;
}
boot();

</script>
