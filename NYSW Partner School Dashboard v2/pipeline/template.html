<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Partner School Success Dashboard · NY Sun Works</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --green:#80BC00; --green-d:#3F6B00; --green-dd:#255007; --green-l:#EEF6DA; --green-xl:#F6FAEA;
  --slate:#55585A; --ink:#2B2D2E; --mute:#8A8E90; --line:#E6E8E3; --bg:#FAFBF7; --card:#fff;
  --yellow:#FED932; --yellow-l:#FFF6CC; --red:#F83311; --red-l:#FFE9E4; --orange:#F08A1C; --orange-l:#FFF0DC;
  --r:14px;
  --f:'Open Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; --fh:'Montserrat','Open Sans',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--f);color:var(--slate);background:var(--bg);font-size:14px;line-height:1.5}
h1,h2,h3,h4{font-family:var(--fh);color:var(--slate);margin:0;line-height:1.2}
button{font:inherit;cursor:pointer}
a{color:var(--green-d)}
.hide{display:none!important}
/* header */
.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.top-in{max-width:1320px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:28px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo{font-family:var(--fh);font-weight:800;line-height:.9;font-size:19px;letter-spacing:-.5px;color:var(--green);text-transform:uppercase;display:block}
.logo b{color:var(--slate);font-weight:800}
.brand small{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:700;margin-top:3px}
nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
nav button{background:none;border:0;padding:10px 12px;font-weight:700;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--slate);border-bottom:3px solid transparent;border-radius:0}
nav button:hover{color:var(--green-d)}
nav button.on{color:var(--green-d);border-bottom-color:var(--green)}
nav .badge{display:inline-block;background:var(--red);color:#fff;border-radius:10px;padding:0 6px;font-size:10px;margin-left:5px;vertical-align:1px}
.who{display:flex;align-items:center;gap:8px;font-size:12px}
.btn{background:var(--yellow);color:#000;border:0;border-radius:15px;padding:8px 16px;font-weight:800;font-size:12.5px;text-transform:uppercase;letter-spacing:.03em}
.btn:hover{filter:brightness(.96)}
.btn.g{background:var(--green);color:#10260a}
.btn.o{background:#fff;border:1.5px solid var(--green);color:var(--green-d)}
.btn.s{padding:5px 11px;font-size:11px;border-radius:11px}
.btn.d{background:#fff;border:1.5px solid var(--line);color:var(--slate)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
main{max-width:1320px;margin:0 auto;padding:22px 24px 80px}
.hero{padding:6px 0 14px}
.hero h1{font-size:30px;font-weight:800;text-transform:uppercase;letter-spacing:-.3px}
.hero h1 em{font-style:normal;color:var(--green)}
.hero p{margin:6px 0 0;max-width:820px;color:var(--slate)}
.asof{display:inline-flex;gap:6px;align-items:center;background:var(--green-l);color:var(--green-dd);border-radius:20px;padding:3px 12px;font-size:12px;font-weight:700;margin-top:10px}
/* cards */
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(185px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.card h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--slate);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.tile{border-top:4px solid var(--green);padding-top:14px}
.tile.red{border-top-color:var(--red)} .tile.yel{border-top-color:var(--yellow)} .tile.org{border-top-color:var(--orange)}
.tile .lab{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--mute)}
.tile .big{font-family:var(--fh);font-size:34px;font-weight:800;color:var(--ink);line-height:1.1;margin:2px 0}
.tile .sub{font-size:12px;color:var(--slate)}
.tile.click{cursor:pointer}.tile.click:hover{box-shadow:0 3px 10px rgba(63,107,0,.14)}
.sec{margin:26px 0 10px;display:flex;align-items:end;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec h2{font-size:18px;text-transform:uppercase}
.sec h2 em{font-style:normal;color:var(--green)}
.sec span{font-size:12px;color:var(--mute)}
/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:12px;padding:1px 9px;font-size:11px;font-weight:700;white-space:nowrap}
.c-high{background:var(--red-l);color:#B21D04}.c-med{background:var(--orange-l);color:#9B5A07}.c-low{background:var(--yellow-l);color:#7A6100}
.c-up{background:#E9F1FB;color:#2A5C99}.c-ok{background:var(--green-l);color:var(--green-dd)}.c-n{background:#EEF0EE;color:var(--slate)}
.grade{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;border-radius:8px;font-family:var(--fh);font-weight:800;font-size:13px}
.gA,.gB{background:var(--green);color:#10260a}.gC{background:var(--yellow);color:#000}.gD{background:var(--orange);color:#fff}.gF{background:var(--red);color:#fff}.gP{background:#E4E6E3;color:var(--slate)}
/* table */
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.tools input,.tools select,.f input,.f select,.f textarea{font:inherit;border:1.5px solid var(--line);border-radius:10px;padding:7px 10px;background:#fff;color:var(--ink)}
.tools input[type=search]{min-width:250px}
.tools input:focus,.tools select:focus,.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--green);outline-offset:0;border-color:var(--green)}
.tbl{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tbl th{background:var(--green-xl);text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:9px 10px;color:var(--slate);white-space:nowrap;cursor:pointer;user-select:none;border-bottom:1px solid var(--line)}
.tbl th.ns{cursor:default}
.tbl td{padding:8px 10px;border-bottom:1px solid #F0F2EC;vertical-align:middle}
.tbl tr.row{cursor:pointer}.tbl tr.row:hover td{background:var(--green-xl)}
.tbl tr:last-child td{border-bottom:0}
.nm b{color:var(--ink);font-weight:700}.nm small{color:var(--mute);display:block;font-size:11px}
.bar{height:7px;border-radius:5px;background:#ECEEE8;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--green);border-radius:5px}
.bar.y i{background:var(--yellow)}.bar.r i{background:var(--red)}.bar.o i{background:var(--orange)}
.muted{color:var(--mute)}.right{text-align:right}
.pager{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px}
/* alerts */
.al{display:flex;gap:12px;padding:11px 14px;border:1px solid var(--line);border-left:5px solid var(--yellow);border-radius:12px;background:#fff;margin-bottom:8px}
.al.high{border-left-color:var(--red)}.al.med{border-left-color:var(--orange)}.al.upcoming{border-left-color:#4A86C9}
.al .t{flex:1;min-width:0}.al .t b{color:var(--ink)}
.al .act{font-size:12px;color:var(--green-dd);margin-top:2px}
.al .btns{display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap;justify-content:flex-end}
.al.done{opacity:.6}
/* drawer */
.ov{position:fixed;inset:0;background:rgba(30,35,25,.35);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(860px,100vw);background:var(--bg);z-index:41;overflow:auto;box-shadow:-8px 0 30px rgba(0,0,0,.15)}
.dh{background:#fff;padding:18px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2;display:flex;gap:14px;align-items:flex-start}
.dh h2{font-size:21px}.dh .x{margin-left:auto;background:none;border:0;font-size:26px;line-height:1;color:var(--mute)}
.db{padding:18px 24px 60px;display:grid;gap:14px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kv div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.kv small{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--mute)}
.kv span{font-weight:700;color:var(--ink)}
.wk{display:flex;gap:5px;flex-wrap:wrap}
.wk div{width:54px;text-align:center;font-size:10px;padding:5px 0;border-radius:8px;background:#EEF0EE;color:var(--slate);font-weight:700}
.wk .ok{background:var(--green);color:#10260a}.wk .late{background:#CDE79A;color:#2d4b06}.wk .miss{background:var(--red);color:#fff}.wk .exc{background:var(--yellow-l);color:#7A6100}.wk .none{background:#F3F4F1;color:#B6BAB6}
.stage{display:flex;gap:0;align-items:center;margin:6px 0 2px}
.stage div{flex:1;text-align:center;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#A9ADA9;position:relative;padding-top:16px}
.stage div:before{content:"";position:absolute;top:3px;left:0;right:0;height:5px;background:#E4E6E3}
.stage div:after{content:"";position:absolute;top:-1px;left:50%;margin-left:-6px;width:12px;height:12px;border-radius:50%;background:#E4E6E3;border:2px solid #fff}
.stage div.on{color:var(--green-dd)}.stage div.on:before,.stage div.on:after{background:var(--green)}
.stage div:first-child:before{left:50%}.stage div:last-child:before{right:50%}
.note{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px}
.note.pin{border-color:var(--yellow);background:#FFFDF0}
.note .m{font-size:11px;color:var(--mute);display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:3px}
.note p{margin:0;white-space:pre-wrap;color:var(--ink)}
.f{display:grid;gap:8px}.f textarea{width:100%;min-height:70px;resize:vertical}
.f .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.src{font-size:11px;color:var(--mute)}
details{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 14px}
summary{cursor:pointer;font-weight:700;color:var(--ink)}
.mini{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}.mini th{text-align:left;color:var(--mute);font-size:10.5px;text-transform:uppercase;padding:3px 6px}.mini td{padding:4px 6px;border-top:1px solid #F0F2EC;vertical-align:top}
.ktbl td,.ktbl th{padding:6px 8px}
.num{width:78px;text-align:right}
.tot{font-family:var(--fh);font-weight:800;font-size:22px}
.tot.bad{color:var(--red)}.tot.good{color:var(--green-d)}
.callout{border-radius:12px;padding:12px 16px;background:var(--yellow-l);border:1px solid #F1DB6A;color:#5b4a00;font-size:13px}
.callout.g{background:var(--green-xl);border-color:#CFE59A;color:var(--green-dd)}
.callout.r{background:var(--red-l);border-color:#F5B7AA;color:#8a1a05}
.lim li{margin-bottom:7px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--green-dd);color:#fff;padding:9px 18px;border-radius:20px;z-index:99;font-weight:700;font-size:13px}
@media(max-width:800px){.top-in{flex-wrap:wrap;gap:8px}.g2{grid-template-columns:1fr}.hero h1{font-size:22px}}
@media print{.top,.tools,.btn{display:none!important}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="brand" href="#"><span class="logo">NY<b>SUN</b><br>WORKS<small>Partner School Success</small></span></a>
  <nav id="nav"></nav>
  <div class="who"><span class="muted" id="whoLbl"></span><button class="btn s d" id="whoBtn">Set name</button><button class="btn s g" id="expBtn">Backup</button></div>
</div></header>
<main id="main"></main>
<div id="ovl"></div>

<script>/*__DATA__*/</script>
<script>
'use strict';
const DATA = window.NYSW_DATA;
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (x,a=0,b=1) => Math.min(b, Math.max(a, x));
const fmtD = d => d ? new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}) : '—';
const fmtDY = d => d ? new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '—';
const dayDiff = (a,b) => Math.round((new Date(a+'T12:00:00') - new Date(b+'T12:00:00'))/864e5);
const pct = x => x==null ? '—' : Math.round(x*100)+'%';
const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
const clone = o => JSON.parse(JSON.stringify(o));

/* ===================== RUBRIC (editable) ===================== */
const GROUPS = {care:'Lab care & reporting', growth:'Harvest & growth', teach:'Teacher & student engagement', lead:'Leadership & relationships'};
const DEFAULT_CFG = {
  settings:{
    asOf: DATA.meta.asOf, evalThrough: DATA.meta.evalThrough,
    graceWeeks:1, cadenceAware:true, minConfidence:35,
    harvestRampStart:'2026-11-01', harvestRampEnd:'2027-01-15', harvestWarn:'2026-12-01', harvestDue:'2027-01-01',
    amvAnnualTarget:3, amvMilestones:['2026-12-15','2027-03-01','2027-06-01'],
    bands:{A:90,B:80,C:70,D:60},
    staleDays:21, offlineStreak:3, missedStreak:2
  },
  kpis:[
    {id:'completion',g:'care',label:'Weekly asset completion',src:'GST Schedule + GST Asset',w:18,floor:.5,target:.95,on:true,unit:'%',hint:'Scheduled visit weeks with an asset logged. Cadence-aware (every-other-week / monthly schools are not penalized for off weeks) and make-up visits within the grace window count.'},
    {id:'systems',g:'care',label:'Systems running',src:'GST Asset',w:7,floor:.6,target:1,on:true,unit:'%',hint:'Share of GST reports with no system marked "not running".'},
    {id:'pests',g:'care',label:'Pest- & leak-free visits',src:'GST Asset',w:3,floor:.6,target:.97,on:true,unit:'%',hint:'Share of reports with no pest or leak issue.'},
    {id:'seedlings',g:'care',label:'Seedlings planted',src:'GST Asset',w:4,floor:.2,target:.8,on:true,unit:'%',hint:'Share of answered "Are seedlings planted?" that are Yes.'},
    {id:'labrating',g:'care',label:'Lab impression & cleanliness',src:'Area Manager Visit',w:6,floor:2,target:4.5,on:true,unit:'/5',hint:'Mean of AM overall impression and cleanliness (1-5). Only when an AMV exists.'},
    {id:'harvest',g:'growth',label:'Harvests logged this year',src:'GST Asset',w:14,floor:0,target:3,on:true,unit:'#',hint:'Distinct harvest days logged. Points phase in between the ramp dates, so harvest cannot drag a grade down before crops are ready.'},
    {id:'teacherconv',g:'teach',label:'Teacher conversation at visits',src:'GST Asset',w:6,floor:.3,target:.85,on:true,unit:'%',hint:'Yes = 1, spoke on phone/text = 0.5, No = 0.'},
    {id:'training',g:'teach',label:'Training follow-through',src:'Ed Team + Schedule',w:10,floor:.4,target:1,on:true,unit:'%',hint:'Completed sessions vs sessions completed + no-shows + scheduled "TT" visits with no training logged.'},
    {id:'curriculum',g:'teach',label:'Curriculum in use',src:'Area Manager Visit',w:4,floor:.5,target:1,on:true,unit:'%',hint:'AMV: "Is the teacher using the curriculum?" Yes=1, has questions=0.5.'},
    {id:'edrubric',g:'teach',label:'Ed team pedagogy rubric',src:'Ed Team',w:4,floor:1,target:3.5,on:true,unit:'/4',hint:'Mean of the five domains on the latest session that was scored (1-4).'},
    {id:'teacherinv',g:'teach',label:'Teacher involvement (AM rating)',src:'Area Manager Visit',w:4,floor:2,target:4.5,on:true,unit:'/5',hint:'AMV teacher involvement/communication rating (1-5).'},
    {id:'principal',g:'lead',label:'Principal / AP engagement',src:'Area Manager Visit',w:12,floor:.25,target:.9,on:true,unit:'%',hint:'In-person with Principal = 1, Assistant Principal = 0.75, none but follow-up email = 0.4, none = 0.'},
    {id:'amcadence',g:'lead',label:'Area manager visit pace',src:'Area Manager Visit',w:8,floor:0,target:1,on:true,unit:'%',hint:'AM visits vs the milestones due so far (3 per year). Counted only once a milestone is due or a visit exists.'}
  ]
};
const KDEF = id => DEFAULT_CFG.kpis.find(k => k.id===id);

/* ===================== STATE / STORAGE ===================== */
const LS = 'nysw_psd_v2';
let ST;
try { ST = JSON.parse(localStorage.getItem(LS)||'null'); } catch(e) { ST = null; }
if (!ST) ST = {user:'', notes:{}, ov:{}, alerts:{}, rubrics:[], snaps:[]};
if (!ST.rubrics.length) ST.rubrics.push({v:1, ts:new Date().toISOString(), by:'System default', note:'Starting rubric (redesigned from Area Manager feedback, Nov 2026)', cfg:clone(DEFAULT_CFG)});
const save = () => { try { localStorage.setItem(LS, JSON.stringify(ST)); } catch(e) { toast('Could not save (browser storage is full or blocked).'); } };
const activeCfg = () => ST.rubrics[ST.rubrics.length-1].cfg;
let UI = {tab:'today', q:'', am:'', gst:'', boro:'', grade:'', stage:'', flag:'', sort:'score', dir:1, page:0, open:null, aq:{am:'', rule:'', sev:'', st:'open'}, draft:null};
function toast(m){ const t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }

/* ===================== ENGINE ===================== */
function schoolView(s){ // apply local overrides
  const o = ST.ov[s.code]||{};
  return Object.assign({}, s, {amEff: o.am || s.am || 'Unassigned', excluded: !!o.excl, amOv: !!o.am});
}
function rampFrac(set){ const a=dayDiff(set.asOf,set.harvestRampStart), b=dayDiff(set.harvestRampEnd,set.harvestRampStart); return clamp(a/b); }
function completion(s,set){
  const W = s.weeks.filter(w => w.w <= set.evalThrough);
  const win = set.cadenceAware ? (s.cadence==='EOW'?1:s.cadence==='Monthly'?3:0) : 0;
  let den=0, ok=0, late=0, exc=0, trail=0; const cells=[];
  W.forEach((w,i)=>{
    if(!w.s){ cells.push({w:w.w, st: w.d?'ok':'none'}); return; }
    if(w.d){den++;ok++;trail=0;cells.push({w:w.w,st:'ok'});return;}
    let lateOK=false;
    for(let g=1;g<=set.graceWeeks;g++){ const n=W[i+g]; if(n && n.d >= (n.s?2:1)){lateOK=true;break;} }
    let ex=false;
    for(let g=1;g<=win;g++){ if((W[i-g]&&W[i-g].d)||(W[i+g]&&W[i+g].d)){ex=true;break;} }
    if(lateOK){den++;late++;ok++;trail=0;cells.push({w:w.w,st:'late'});return;}
    if(ex){exc++;cells.push({w:w.w,st:'exc'});return;}
    den++;trail++;cells.push({w:w.w,st:'miss'});
  });
  return {den, ok, late, exc, trail, rate: den>=2 ? ok/den : null, cells, missed: cells.filter(c=>c.st==='miss').map(c=>c.w)};
}
function harvestInfo(s){
  const days = [...new Set(s.harvest.map(h=>h.d))];
  const lbs = s.harvest.reduce((a,h)=>a+(h.lb||0),0);
  return {n:days.length, lbs, last: days.sort().pop()||null, amb: s.harvest.some(h=>h.amb)};
}
function stageOf(s,set,H){
  const asOf=set.asOf;
  if(H.n>0){ return {i: (H.last && dayDiff(asOf,H.last)<=35) ? 4 : 3, label: (H.last && dayDiff(asOf,H.last)<=35)?'Harvesting':'Harvested'}; }
  const nh = s.agg.nextHarvest;
  if(s.agg.lastSeed==='No' && s.agg.seedYes===0) return {i:0,label:'Not planted'};
  if(nh && dayDiff(nh,asOf)<-14) return {i:2,label:'Harvest overdue',warn:true};
  if(nh && dayDiff(nh,asOf)<=21) return {i:3,label:'Harvest soon'};
  if(s.agg.seedYes>0) return {i:s.agg.seedYes>=3?2:1,label: s.agg.seedYes>=3?'Growing':'Seedlings'};
  return {i:-1,label:'No growth data'};
}
const PMAP = v => !v?null : /^Yes - Principal/.test(v)?1 : /^Yes - Vice/.test(v)?.75 : null;
function kpiValues(s,cfg){
  const set=cfg.settings, a=s.agg, out={};
  const C=completion(s,set); out.completion={v:C.rate, disp: C.den? `${C.ok}/${C.den} weeks`+(C.late?` (${C.late} late)`:'')+(C.exc?`, ${C.exc} off-cycle`:''):'no schedule', avail:C.rate!=null};
  out.systems={v:a.n>=2?1-a.offN/a.n:null, disp:`${a.n-a.offN}/${a.n} reports clean`, avail:a.n>=2};
  out.pests={v:a.n>=2?clamp(1-(a.pestN+a.leakN)/a.n):null, disp:`${a.pestN} pest, ${a.leakN} leak`, avail:a.n>=2};
  const sk=a.seedYes+a.seedNo; out.seedlings={v:sk>=2?a.seedYes/sk:null, disp:`${a.seedYes}/${sk} yes`, avail:sk>=2};
  const A=s.amv; const imp=[], inv=[], cur=[], pr=[];
  A.forEach(x=>{ const m=avg([x.imp,x.clean].filter(z=>z!=null)); if(m!=null) imp.push(m); if(x.inv!=null) inv.push(x.inv);

function evalSchool(s,cfg){

function vHealth(m){
  hero(m,'Data <em>health</em> &amp; limits','What this dashboard can and cannot tell you from the files uploaded, and the clean-up that would improve it.');
  const d=DATA.diag, rs=allR(), rec=d.reconcile, ks=Object.keys(rec).sort();
  const noAM=rs.filter(r=>r.s.amEff==='Unassigned'), nonSchool=rs.filter(r=>!r.s.isSchool);
  const rt=ks.map(k=>`<tr><td>${fmtD(k)}</td><td>${rec[k].manual_missing}</td><td><b>${rec[k].manual_missing_but_logged}</b></td><td>${rec[k].manual_missing_cadence_tagged}</td><td>${rec[k].scheduled}</td><td>${rec[k].logged}</td><td>${pct(rec[k].logged/rec[k].scheduled)}</td></tr>`).join('');
  m.insertAdjacentHTML('beforeend',`<div class="grid g4">
  <div class="card tile org"><div class="lab">Hand-built "missing" lists already in Accelo</div><div class="big">${ks.reduce((a,k)=>a+rec[k].manual_missing_but_logged,0)}</div><div class="sub">of ${ks.reduce((a,k)=>a+rec[k].manual_missing,0)} school-weeks listed as missing actually have an asset logged that week</div></div>
  <div class="card tile yel"><div class="lab">Assets with no visit date</div><div class="big">${d.gst_missing_visit_date}</div><div class="sub">dates recovered from titles; ${d.gst_unrecoverable_date} unrecoverable</div></div>
  <div class="card tile"><div class="lab">Duplicate school-days removed</div><div class="big">${d.gst_duplicate_school_days}</div><div class="sub">same school logged twice on one day</div></div>
  <div class="card tile red"><div class="lab">Schools with no area manager</div><div class="big">${noAM.length}</div><div class="sub">out-of-state, non-school or unassigned partners</div></div></div>
  <div class="sec"><h2>Missing-asset sheet vs <em>live data</em></h2><span>Why the weekly list overstates misses</span></div>
  <div class="card"><table class="mini"><thead><tr><th>Week of</th><th>Listed missing (sheet)</th><th>…but logged in export</th><th>Of those, EOW/monthly</th><th>Scheduled</th><th>Logged</th><th>Rate</th></tr></thead><tbody>${rt}</tbody></table>
  <p class="src">Sheets are point-in-time snapshots: they are not refreshed when an asset is filed late, and they list every-other-week/monthly schools as missing on their off week. This dashboard recomputes from the Accelo export and the schedule instead, with a make-up grace window and cadence awareness (both editable in Rubric).</p></div>
  <div class="sec"><h2>Limitations <em>to know</em></h2><span>Read before trusting a grade</span></div>
  <div class="card"><ul class="lim" style="margin:0;padding-left:18px">
   <li><b>Only 9 weeks of data.</b> No trend lines or year-over-year comparisons are possible yet. Use “Backup” and the snapshots in notes to start your own history; a persistent database is needed for real trends.</li>
   <li><b>Harvest data is thin and messy.</b> Only ${rs.filter(r=>r.E.H.n>0).length} schools have a harvest logged; weights are free text (“13 oz”, “2078 gr”, “~20”, bare “10”), so pounds are converted when a unit exists and bare numbers are marked ambiguous. Harvest points phase in Nov 1 → Jan 15 so an early blank doesn't tank a grade.</li>
   <li><b>The export has no “submitted on” date.</b> A truly <i>late</i> asset can't be told from an on-time one; “late” here means a make-up visit in a following week. A Created/Submitted timestamp from Accelo would fix this.</li>
   <li><b>The weekly schedule is a template, not a record of visits.</b> It is a human-readable grid: codes are extracted by pattern, “@” pairs are treated as one visit, and entries like “SBH”, “Lincoln”, “Roaring Brook” rely on name matching. Cadence (EOW/monthly) is inferred from notes typed in the cells and is inconsistent week to week.</li>
   <li><b>The current week is incomplete.</b> The Nov 2–6 week had ~36 assets when exported (vs ~250 normally), so it is excluded from scoring (“full weeks through” date).</li>
   <li><b>Area manager assignment comes from the asset files.</b> ${noAM.length} schools have no AM; ${nonSchool.length} partners are not NYC DBN schools (NJ/AL/Westchester/community orgs like UPROSE). Use “Edit assignment / hide from list” in a school's profile; changes are local until the roster is fixed in Accelo.</li>
   <li><b>Not in the upload, so not scored:</b> teacher survey, HC performance, maintenance agreements, thank-you/support letters, events, photo timestamps, billable-hour logs, the scheduling-sheet “lab available” column (V). The rubric is rebuilt around what <i>is</i> available.</li>
   <li><b>Teacher/principal turnover</b> can only be hinted at from the “Affiliation” contact on asset reports (it flips between people at many schools, so only a sustained switch is flagged) and “teachers trained” names, over 9 weeks of data. Log changes in school notes (type: Teacher change / Principal change) to build the history.</li>
   <li><b>“Systems not running” is self-reported</b> by GSTs and the same list is often copy-pasted visit to visit, so a long streak may be stale reporting rather than a still-broken system. Alerts say “reported”, not “confirmed”.</li>
   <li><b>No login yet.</b> Notes and snoozes save in <i>this browser</i> with the name you set, not on a server. Use Backup to export/import. A shared database + login is on the roadmap.</li></ul></div>
  <div class="sec"><h2>Schools to <em>clean up</em></h2><span>${noAM.length} without an AM</span></div>
  <div class="card"><div style="columns:2;font-size:12.5px">${noAM.map(r=>`<div><a href="#" data-open="${r.s.code}">${esc(r.s.full)}</a></div>`).join('')}</div></div>
  <div class="sec"><h2>On the <em>roadmap</em></h2><span>From the Nov area-manager meeting</span></div>
  <div class="card"><div class="grid g2" style="gap:10px"><div><b>Built here</b><ul class="lim"><li>Action queue with acknowledge / snooze / resolve</li><li>Email digest per AM (opens your mail app)</li><li>Editable rubric with version history &amp; 100-point check</li><li>Harvest phase-in, cadence-aware and grace-window asset scoring</li><li>Growth stage per lab; GST visit day</li><li>Editable notes, AM reassignment, teacher/principal change log</li></ul></div>
  <div><b>Needs a server / more data</b><ul class="lim"><li>Real login, roles and an audit trail of who edited what</li><li>Automatic email alerts (needs a mail service)</li><li>Photo-timestamp check (needs Drive metadata)</li><li>Principal Engagement rubric / Principal Relationship asset in Accelo</li><li>Teacher &amp; principal turnover history (needs a contacts table)</li><li>Asset created-date, billable hours at asset entry</li></ul></div></div></div>`);
}

  const amv=s.amv.slice().reverse().map(x=>`<tr><td>${fmtD(x.d)}</td><td>${esc(x.am||'')}</td><td>${esc(x.pconv||'')}${x.fu?` <span class="muted">(email: ${esc(x.fu)})</span>`:''}</td><td>${esc(x.tconv||'')}</td><td>${esc(x.curr||'')}</td><td>${[x.imp,x.inv,x.clean].map(v=>v??'–').join(' / ')}</td><td>${esc(x.note||'')}</td></tr>`).join('');
  const ed=s.ed.slice().reverse().map(x=>`<tr><td>${fmtD(x.d)}</td><td>${esc(x.sess||'—')}${x.ns?' <span class="chip c-high">no-show</span>':''}</td><td>${esc(x.spec||'')}</td><td>${esc(x.teachers||'')}</td><td>${Object.values(x.rub||{}).some(v=>v!=null)?Object.values(x.rub).map(v=>v??'–').join('/'):''}</td><td>${esc(x.note||'')}</td></tr>`).join('');
  const nt=notes.slice().sort((a,b)=>(b.pin?1:0)-(a.pin?1:0)||b.ts.localeCompare(a.ts)).map(n=>`<div class="note ${n.pin?'pin':''}"><div class="m"><span class="chip c-n">${esc(n.type)}</span><b>${esc(n.by||'Unknown')}</b><span>${new Date(n.ts).toLocaleString()}</span>${n.due?`<span class="chip c-low">follow up ${fmtD(n.due)}</span>`:''}<span style="margin-left:auto"><button class="btn s d" data-npin="${n.id}">${n.pin?'Unpin':'Pin'}</button> <button class="btn s d" data-ndel="${n.id}">Delete</button></span></div><p>${esc(n.text)}</p></div>`).join('');
  const cr=E.C;
  $('#ovl').innerHTML=`<div class="ov" data-close="1"></div><aside class="drawer"><div class="dh"><div style="flex:1"><div class="src">${esc(s.code)} · ${esc(s.borough||'')} · ${esc(s.span||'')} · ${esc(s.programYear||'')}</div><h2>${esc(s.name)}</h2><div style="margin-top:6px">${gradeChip(E)} <b style="font-size:18px;color:var(--ink)">${E.score!=null?Math.round(E.score):'—'}</b><span class="muted"> / 100 · ${Math.round(E.conf*100)}% of rubric has data${E.prov?' · <b>provisional</b>':''}</span></div></div><button class="x" data-close="1" aria-label="Close">×</button></div>
  <div class="db">
   <div class="kv"><div><small>Area manager</small><span>${esc(s.amEff)}</span></div><div><small>GST</small><span>${esc(s.gst||'—')}${s.gstAll.length>1?` <span class="muted">(+${esc(s.gstAll.slice(1).join(', '))})</span>`:''}</span></div><div><small>GST visit day</small><span>${esc(s.visitDay||'—')}</span></div><div><small>Visit cadence</small><span>${esc(s.cadence||'—')}</span></div><div><small>Last GST visit</small><span>${fmtDY(s.lastVisit)}</span></div><div><small>Installed</small><span>${esc(s.installQ||'—')}</span></div></div>
   <div class="card"><h3>Growth <span class="src" style="text-transform:none;letter-spacing:0">${E.stage.label}${s.agg.nextHarvest?' · GST harvest estimate '+fmtDY(s.agg.nextHarvest):''}</span></h3><div class="stage">${stageNames.map((n,i)=>`<div class="${i<=E.stage.i?'on':''}">${n}</div>`).join('')}</div><div class="src">${E.H.n} harvest${E.H.n===1?'':'s'} logged${E.H.lbs?` · ${E.H.lbs.toFixed(1)} lb total`:''}. Stage is inferred from “seedlings planted?”, GST harvest estimate and harvest logs — it is only as current as the last report.</div></div>
   ${als.length?`<div class="card"><h3>Alerts</h3>${als.map(a=>alertRow({a,st:alertState(code,a),r},true)).join('')}</div>`:''}
   <div class="card"><h3>Weekly assets <span class="src" style="text-transform:none;letter-spacing:0">${cr.den?`${cr.ok}/${cr.den} done · ${cr.exc} off-cycle`:'not on the schedule'}</span></h3><div class="wk">${wk}</div><div class="src" style="margin-top:6px"><span class="chip c-ok">logged</span> <span class="chip" style="background:#CDE79A">make-up</span> <span class="chip c-high">missed</span> <span class="chip c-low">off-cycle (EOW/monthly)</span> <span class="chip c-n">not scheduled</span></div></div>
   <div class="card"><h3>Score breakdown</h3><table class="mini ktbl"><thead><tr><th>Measure</th><th>Actual</th><th class="right">Points</th><th></th></tr></thead><tbody>${kt}</tbody></table></div>
   <div class="card f"><h3>Notes &amp; follow-ups</h3>${nt||'<div class="muted">No notes yet.</div>'}
     <textarea id="ntext" placeholder="Add a note — what you saw, who you spoke to, what's next…"></textarea>
     <div class="row"><select id="ntype">${['General','Principal','Teacher change','Principal change','Follow-up','Harvest','Maintenance'].map(t=>`<option>${t}</option>`).join('')}</select><label class="src">Follow up by <input type="date" id="ndue"></label><label class="src"><input type="checkbox" id="npin"> Pin</label><button class="btn g s" id="nadd" style="margin-left:auto">Add note</button></div></div>
   <div class="card f"><h3>Assignment</h3><div class="row"><label class="src">Area manager <select id="amsel">${uniq(['Unassigned',...Object.values(DATA.schools).map(x=>x.am),...Object.values(R).map(x=>x.s.amEff)]).map(a=>`<option ${a===s.amEff?'selected':''}>${esc(a)}</option>`).join('')}</select></label><button class="btn s d" id="amsave">Save assignment</button><button class="btn s d" id="exclude">Hide from dashboard (not a partner school / not mine)</button></div><div class="src">Assignment from asset files: ${esc(DATA.schools[code].am||'none')}${DATA.schools[code].amPhase1&&DATA.schools[code].amPhase1!==DATA.schools[code].am?` · phase-1 roster said ${esc(DATA.schools[code].amPhase1)}`:''}. Edits are stored in this browser.</div></div>
   <details><summary>GST reports (latest ${s.reports.length} of ${s.nReports})</summary><table class="mini"><thead><tr><th>Date</th><th>GST</th><th>Systems</th><th>Seedlings</th><th>Teacher talk</th><th>Notes</th></tr></thead><tbody>${reps}</tbody></table></details>
   <details><summary>Harvests (${s.harvest.length})</summary><table class="mini"><tbody>${H||'<tr><td class="muted">None logged this year.</td></tr>'}</tbody></table></details>
   <details><summary>Area manager visits (${s.amv.length})</summary><table class="mini"><thead><tr><th>Date</th><th>AM</th><th>Principal/AP</th><th>Teacher</th><th>Curriculum</th><th>Lab / Teacher / Clean</th><th>Notes</th></tr></thead><tbody>${amv||'<tr><td class="muted" colspan="7">No AM visit on file this year.</td></tr>'}</tbody></table></details>
   <details><summary>Ed team sessions (${s.ed.length})</summary><table class="mini"><thead><tr><th>Date</th><th>Session</th><th>Specialist</th><th>Teachers</th><th>Rubric</th><th>Notes</th></tr></thead><tbody>${ed||'<tr><td class="muted" colspan="6">No sessions on file.</td></tr>'}</tbody></table></details>
  </div></aside>`;
}
function closeDrawer(){ UI.open=null; $('#ovl').innerHTML=''; }

/* ===================== EVENTS ===================== */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-open],[data-close],[data-sort],[data-pg],[data-al],[data-go],[data-amq],[data-dig],[data-npin],[data-ndel],[data-rest]');
  if(e.target.id==='nadd') return addNote();
  if(e.target.id==='amsave'){ const v=$('#amsel').value; const c=UI.open; ST.ov[c]=ST.ov[c]||{}; if(v==='Unassigned'||v===DATA.schools[c].am) delete ST.ov[c].am; else ST.ov[c].am=v; save(); render(); toast('Assignment saved'); return; }
  if(e.target.id==='exclude'){ if(confirm('Hide this school from the dashboard? You can restore it from Backup/import.')){ const c=UI.open; ST.ov[c]=ST.ov[c]||{}; ST.ov[c].excl=true; save(); closeDrawer(); render(); toast('Hidden'); } return; }
  if(e.target.id==='clr'){ Object.assign(UI,{q:'',am:'',gst:'',boro:'',grade:'',stage:'',flag:'',page:0}); render(); return; }
  if(e.target.id==='csv') return exportCSV();
  if(e.target.id==='digest'){ const d=digestText(UI.aq.am); openDigest(UI.aq.am,d); return; }
  if(e.target.id==='rbal'){ const on=UI.draft.kpis.filter(k=>k.on), tot=on.reduce((a,k)=>a+(+k.w||0),0)||1; on.forEach(k=>k.w=Math.max(0,Math.round(k.w/tot*100))); const diff=100-on.reduce((a,k)=>a+k.w,0); on.sort((a,b)=>b.w-a.w)[0].w+=diff; render(); return; }
  if(e.target.id==='rrev'){ UI.draft=null; render(); return; }
  if(e.target.id==='rsave'){ const note=$('#rnote').value.trim(); if(!note){toast('Add a reason for the change first.');return;} if(!ST.user){toast('Set your name first (top right).');return;}
    ST.rubrics.push({v:ST.rubrics.length+1,ts:new Date().toISOString(),by:ST.user,note,cfg:clone(UI.draft)}); UI.draft=null; save(); render(); toast('Rubric saved as v'+ST.rubrics.length); return; }
  if(e.target.id==='whoBtn'){ const n=prompt('Your name (shown on notes and rubric changes):',ST.user||''); if(n!=null){ST.user=n.trim();save();renderNav();} return; }
  if(e.target.id==='expBtn') return backup();
  if(!t) return;
  if(t.dataset.close){ closeDrawer(); return; }
  if(t.dataset.tab){ UI.tab=t.dataset.tab; closeDrawer(); render(); window.scrollTo(0,0); return; }
  if(t.dataset.go){ e.preventDefault(); UI.tab=t.dataset.go; if(t.dataset.flag){UI.flag=t.dataset.flag;} render(); window.scrollTo(0,0); return; }
  if(t.dataset.open){ e.preventDefault(); if(e.target.closest('[data-al]')&&!e.target.closest('a')&&e.target.dataset.open===undefined) {} UI.open=t.dataset.open; renderDrawer(UI.open); $('.drawer')?.scrollTo(0,0); return; }
  if(t.dataset.sort){ const k=t.dataset.sort; if(UI.sort===k) UI.dir*=-1; else {UI.sort=k;UI.dir=(k==='name'||k==='am'||k==='gst')?1:-1;} drawTable(); return; }
  if(t.dataset.pg){ UI.page+=+t.dataset.pg; drawTable(); return; }
  if(t.dataset.amq){ UI.aq.am=t.dataset.amq; UI.tab='queue'; render(); return; }
  if(t.dataset.dig){ openDigest(t.dataset.dig,digestText(t.dataset.dig)); return; }
  if(t.dataset.rest){ const v=ST.rubrics.find(x=>x.v==t.dataset.rest); UI.draft=clone(v.cfg); render(); toast('Loaded v'+v.v+' as a draft'); return; }
  if(t.dataset.npin){ const n=(ST.notes[UI.open]||[]).find(x=>x.id===t.dataset.npin); n.pin=!n.pin; save(); render(); return; }
  if(t.dataset.ndel){ if(confirm('Delete this note?')){ ST.notes[UI.open]=ST.notes[UI.open].filter(x=>x.id!==t.dataset.ndel); save(); render(); } return; }
  if(t.dataset.al){ const c=t.dataset.c, ru=t.dataset.r, a=R[c].al.find(x=>x.rule===ru); const k=c+'|'+ru, act=t.dataset.al;
    if(act==='reopen') delete ST.alerts[k];
    else { ST.alerts[k]={status:act,sig:a.sig,by:ST.user||'',at:new Date().toISOString(),until:act==='snooze'?new Date(Date.parse(activeCfg().settings.asOf)+14*864e5).toISOString().slice(0,10):null}; if(act==='snooze') ST.alerts[k].status='snoozed'; }
    save(); if(UI.tab==='queue'){ render(); } else render(); return; }
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){ UI.q=e.target.value; UI.page=0; drawTable(); return; }
  const k=e.target.dataset.k; if(k&&UI.draft){ const kp=UI.draft.kpis.find(x=>x.id===k), p=e.target.dataset.p; kp[p]= p==='on'?e.target.checked : +e.target.value; if(p==='on'||p==='w'){ clearTimeout(window._rt); window._rt=setTimeout(()=>{ const pos=window.scrollY; render(); window.scrollTo(0,pos); },450);} }
  if(e.target.dataset.s&&UI.draft){ draftSet(e.target.dataset.s,e.target.value); }
});
document.addEventListener('change',e=>{
  const f=e.target.dataset.f; if(f){ UI[f]=e.target.value; UI.page=0; drawTable(); return; }
  const aq=e.target.dataset.aq; if(aq){ UI.aq[aq]=e.target.value; drawQueue(); return; }
  if(e.target.dataset.s&&UI.draft){ draftSet(e.target.dataset.s,e.target.value); render(); }
  if(e.target.dataset.p==='on'){ render(); }
});
function addNote(){
  const text=$('#ntext').value.trim(); if(!text){toast('Write something first.');return;}
  if(!ST.user){ const n=prompt('Your name (so notes show who wrote them):',''); if(!n) return; ST.user=n.trim(); }
  (ST.notes[UI.open]=ST.notes[UI.open]||[]).push({id:'n'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),ts:new Date().toISOString(),by:ST.user,type:$('#ntype').value,text,due:$('#ndue').value||null,pin:$('#npin').checked});
  save(); render(); toast('Note saved');
}
function openDigest(am,d){
  if(!d.n){toast('No open alerts to send'+(am?' for '+am:'')+'.');return;}
  const url='mailto:?subject='+encodeURIComponent(d.subject)+'&body='+encodeURIComponent(d.body.slice(0,1700));
  navigator.clipboard?.writeText(d.subject+'\n\n'+d.body).then(()=>toast('Digest copied to clipboard'),()=>{});
  window.location.href=url;
}
function download(name,text,type){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }
function backup(){
  const choice=prompt('Type EXPORT to download a backup of your notes, snoozes, assignments and rubric versions.\nType IMPORT to restore from a backup file.','EXPORT');
  if(!choice) return;
  if(choice.toUpperCase()==='EXPORT'){ download('nysw-dashboard-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(ST,null,1),'application/json'); }
  else { const i=document.createElement('input'); i.type='file'; i.accept='.json'; i.onchange=()=>{ const f=i.files[0]; if(!f) return; f.text().then(t=>{ try{ const o=JSON.parse(t); if(!o.rubrics||!o.notes) throw 0; if(confirm('Replace everything saved in this browser with this backup?')){ ST=o; save(); UI.draft=null; render(); toast('Backup restored'); } }catch(e){ toast('That file is not a valid backup.'); } }); }; i.click(); }
}
function exportCSV(){
  const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
  const rows=[['Code','School','Borough','Area manager','GST','Score','Grade','Data confidence','Assets completed','Last GST visit','Growth stage','Harvests','AM visits','Open alerts','Notes']];
  filteredSchools().forEach(r=>rows.push([r.s.code,r.s.name,r.s.borough,r.s.amEff,r.s.gst,r.E.score!=null?r.E.score.toFixed(1):'',r.E.prov?'Provisional':r.E.grade,Math.round(r.E.conf*100)+'%',r.E.C.rate!=null?Math.round(r.E.C.rate*100)+'%':'',r.s.lastVisit,r.E.stage.label,r.E.H.n,r.s.amv.length,r.al.filter(a=>a.sev!=='upcoming'&&alertState(r.s.code,a)==='open').map(a=>a.title).join('; '),(ST.notes[r.s.code]||[]).map(n=>n.text).join(' | ')]));
  download('partner-schools.csv',rows.map(r=>r.map(q).join(',')).join('\n'),'text/csv');
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&UI.open) closeDrawer(); });
render();
</script>
</body>
